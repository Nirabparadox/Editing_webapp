<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basic Online Editor</title>
  <!-- Tailwind via CDN: no install needed -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <header class="bg-indigo-600 text-white px-6 py-4 shadow">
    <h1 class="text-xl font-semibold">Basic Online Editing Website</h1>
  </header>

  <main class="max-w-6xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-4">

    <!-- Canvas area -->
    <section class="md:col-span-2 bg-white rounded-xl shadow p-4 flex items-center justify-center min-h-[400px]">
      <p id="placeholder" class="text-gray-400">Upload an image to start editing</p>
      <canvas id="canvas" class="hidden max-w-full max-h-[70vh] border rounded"></canvas>
    </section>

    <!-- Tools panel -->
    <aside class="bg-white rounded-xl shadow p-4 space-y-5">

      <div>
        <label class="block text-sm font-medium mb-1">Upload image</label>
        <input id="fileInput" type="file" accept="image/*"
               class="block w-full text-sm file:mr-3 file:py-2 file:px-3 file:rounded file:border-0 file:bg-indigo-600 file:text-white hover:file:bg-indigo-700" />
      </div>

      <div>
        <label class="block text-sm font-medium">Brightness: <span id="brightnessVal">0</span></label>
        <input id="brightness" type="range" min="-100" max="100" value="0" class="w-full" disabled />
      </div>

      <div>
        <label class="block text-sm font-medium">Contrast: <span id="contrastVal">0</span></label>
        <input id="contrast" type="range" min="-100" max="100" value="0" class="w-full" disabled />
      </div>

      <div>
        <p class="text-sm font-medium mb-2">Filters</p>
        <div class="grid grid-cols-2 gap-2">
          <button data-filter="none"      class="filter-btn px-3 py-2 rounded border bg-indigo-600 text-white">None</button>
          <button data-filter="grayscale" class="filter-btn px-3 py-2 rounded border">Grayscale</button>
          <button data-filter="sepia"     class="filter-btn px-3 py-2 rounded border">Sepia</button>
          <button data-filter="invert"    class="filter-btn px-3 py-2 rounded border">Invert</button>
        </div>
      </div>

      <div class="flex gap-2">
        <button id="resetBtn" class="flex-1 px-3 py-2 rounded bg-gray-200 hover:bg-gray-300">Reset</button>
        <select id="format" class="px-2 rounded border">
          <option value="png">PNG</option>
          <option value="jpeg">JPG</option>
        </select>
        <button id="downloadBtn" class="flex-1 px-3 py-2 rounded bg-green-600 text-white hover:bg-green-700">Download</button>
      </div>

    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
